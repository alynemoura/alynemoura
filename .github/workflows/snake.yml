name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"   # Executa a cada 12 horas (expressão cron mais padrão)
  workflow_dispatch:
  push:
    branches:
      - main                 # Muitos repositórios agora usam main; se o seu for master, altere de volta para master
      - master

jobs:
  generate:
    permissions:
      contents: write        # Necessário para enviar para a branch output
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: alynemoura
          github_token: ${{ secrets.GITHUB_TOKEN }}   # Recomenda-se adicionar para evitar limitações de API
          outputs: |
            dist/snake.svg?palette=github-dark

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4   # Atualizado para v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
